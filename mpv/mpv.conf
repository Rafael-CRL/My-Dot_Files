osc=no
osd-bar=no
border=no

# Tested with mpv 0.39.0+

# Recommended quality profile
profile=high-quality

# Video output — gpu-next é o mais moderno
vo=gpu-next

# No Linux com AMD, vulkan é o correto para gpu-api
gpu-api=vulkan

# hwdec: AMD no Linux usa vaapi (não vulkan como no Windows)
hwdec=vaapi

# Bitdepth do monitor — deixa auto se não souber
dither-depth=auto

# HDR passthrough
target-colorspace-hint=yes

# Áudio
audio-exclusive=no
audio-channels=auto-safe

# Remove gaps de legenda menores que 210ms
sub-fix-timing=yes

# Interpolação — reduz stuttering
video-sync=display-resample
interpolation=yes
tscale=oversample

# Legendas — configurações para estudo de idioma
sub-auto=fuzzy
sub-font-size=40
sub-bold=yes

# Deband para fontes 8-bit
[Deband]
profile-cond=p["video-params/pixelformat"] == "yuv420p"
deband=yes
deband-iterations=2
deband-threshold=32
deband-range=16
deband-grain=0
